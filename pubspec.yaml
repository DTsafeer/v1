name: v1
description: "نظام إدارة الكافيهات والمطاعم - سستم كافيه برو"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # الأيقونات والدعم الأساسي
  cupertino_icons: ^1.0.8

  # دعم اللغات والتواريخ (RTL & Formatting)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # الاتصال بالـ REST API والشبكة
  http: ^1.2.0
  connectivity_plus: ^6.0.3

  # تخزين إعدادات جلب البيانات المحتفظ بها محلياً
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # يمكنك تفعيل الصور والخطوط هنا عند حاجتك لها لاحقاً:
  # assets:
  #   - assets/images/